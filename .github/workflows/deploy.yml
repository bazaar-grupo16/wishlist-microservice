# ──────────────────────────────────────────────────────────────
# CI/CD Pipeline — Wishlist Microservice
#
# Secrets required in GitHub repository settings:
#   DIGITALOCEAN_ACCESS_TOKEN  — DigitalOcean API token
#   DOKS_CLUSTER_NAME          — DOKS cluster name
#   DB_USER                    — PostgreSQL username
#   DB_PASSWORD                — PostgreSQL password
#   DB_NAME                    — PostgreSQL database name
# ──────────────────────────────────────────────────────────────
name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ── 0. Path filter ─────────────────────────────────
  paths-filter:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      k8s: ${{ steps.filter.outputs.k8s }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - "src/**"
              - "tests/**"
              - "Dockerfile"
              - "Dockerfile.test"
              - "docker-compose.test.yml"
              - "requirements.txt"
              - "pyproject.toml"
            k8s:
              - "k8s/**"

  # ── 1. Lint ────────────────────────────────────────
  lint:
    name: Lint
    needs: paths-filter
    if: needs.paths-filter.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Lint with Ruff
        run: ruff check src/ tests/

  # ── 2. SAST ────────────────────────────────────────
  sast:
    name: Security Check
    needs: [paths-filter, lint]
    if: needs.paths-filter.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: bandit -r src/ -ll

  # ── 3. Test ────────────────────────────────────────
  test:
    name: Test
    needs: [paths-filter, lint]
    if: needs.paths-filter.outputs.app == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run tests via Docker Compose
        run: |
          docker compose -f docker-compose.test.yml up \
            --build \
            --abort-on-container-exit \
            --exit-code-from test-runner

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # ── 4. Build & Push Docker image ───────────────────
  build:
    name: Build & Push
    needs: [paths-filter, sast, test]
    if: |
      (needs.paths-filter.outputs.app == 'true') &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  # ── 5. Deploy to Kubernetes ─────────────────────────
  deploy:
    name: Deploy to K8s
    needs: [paths-filter, lint, sast, test, build]
    if: |
      always() &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (needs.sast.result == 'success' || needs.sast.result == 'skipped') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.paths-filter.outputs.app == 'true' || needs.paths-filter.outputs.k8s == 'true') &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Configure kubectl
        run: doctl kubernetes cluster kubeconfig save ${{ secrets.DOKS_CLUSTER_NAME }}

      - name: Create namespace if not exists
        run: |
          kubectl create namespace bazaar-dev --dry-run=client -o yaml | kubectl apply -f -

      - name: Create GHCR image pull secret
        run: |
          kubectl create secret docker-registry ghcr-login-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --namespace=bazaar-dev \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply DB credentials secret
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          sudo apt-get install -y gettext-base
          envsubst '${DB_USER} ${DB_PASSWORD} ${DB_NAME}' \
            < k8s/secret.yaml | kubectl apply -f - -n bazaar-dev

      - name: Apply infrastructure manifests
        run: |
          kubectl apply -f k8s/db-pvc.yaml -n bazaar-dev
          kubectl apply -f k8s/db-deployment.yaml -n bazaar-dev
          kubectl apply -f k8s/db-service.yaml -n bazaar-dev
          kubectl apply -f k8s/app-service.yaml -n bazaar-dev
          kubectl apply -f k8s/ingress.yaml -n bazaar-dev

      - name: Deploy application
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.paths-filter.outputs.app == 'true' && github.sha || 'latest' }}
        run: |
          envsubst '${IMAGE_NAME} ${IMAGE_TAG}' \
            < k8s/app-deployment.yaml | kubectl apply -f - -n bazaar-dev

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/wishlist-service \
            -n bazaar-dev --timeout=120s
