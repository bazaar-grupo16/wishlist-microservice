# ──────────────────────────────────────────────────────────────
# Kubernetes Ingress — Wishlist Microservice
# ──────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wishlist-ingress
  labels:
    app: wishlist-service
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/auth-url: "http://auth-service.bazaar-dev.svc.cluster.local/validate"
    nginx.ingress.kubernetes.io/auth-method: "GET"
    nginx.ingress.kubernetes.io/auth-response-headers: "X-User-ID"
spec:
  rules:
    - http:
        paths:
          - path: /wishlist(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: wishlist-service
                port:
                  number: 80
