# ──────────────────────────────────────────────────────────────
# Kubernetes Service — Wishlist PostgreSQL Database
# ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: wishlist-db
  labels:
    app: wishlist-db
spec:
  type: ClusterIP
  selector:
    app: wishlist-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
