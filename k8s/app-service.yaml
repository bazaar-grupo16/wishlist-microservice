# ──────────────────────────────────────────────────────────────
# Kubernetes Service — Wishlist Microservice
# ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: wishlist-service
  labels:
    app: wishlist-service
spec:
  type: ClusterIP
  selector:
    app: wishlist-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
