# ──────────────────────────────────────────────────────────────
# Kubernetes Secret — Wishlist PostgreSQL Database
# ──────────────────────────────────────────────────────────────
# Complete secrets in GitHub repository secrets
apiVersion: v1
kind: Secret
metadata:
  name: wishlist-db-credentials
type: Opaque
stringData:
  DB_HOST: wishlist-db
  DB_PORT: "5432"
  DB_USER: $DB_USER
  DB_PASSWORD: $DB_PASSWORD
  DB_NAME: $DB_NAME
